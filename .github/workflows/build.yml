name: Build and package unsigned driver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (automatic runs use 0.0.RUN_NUMBER)
        required: true
        default: "1.0.14"
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned x86_64 components
    runs-on: macos-15-intel
    timeout-minutes: 45

    env:
      # uefi 0.41.0 and uefi-macros 0.20.0 require Rust 1.91 or newer.
      RUST_VERSION: 1.91.1
      VULKAN_HEADERS_COMMIT: 8864cdc896bbc2a9b6eb36b3218fc9ef57908d77

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record toolchain
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcrun clang --version

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-unknown-uefi

      - name: Fetch pinned Vulkan headers
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/Vulkan-Headers"
          git -C "$RUNNER_TEMP/Vulkan-Headers" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$RUNNER_TEMP/Vulkan-Headers" fetch --depth=1 origin "$VULKAN_HEADERS_COMMIT"
          git -C "$RUNNER_TEMP/Vulkan-Headers" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Vulkan-Headers" rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"

      - name: Build shader translator
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          cargo build --locked --release \
            --manifest-path translator/wrapper/Cargo.toml \
            --target-dir "$RUNNER_TEMP/translator-target"
          install_name_tool -id @rpath/libnvmtl_translate.dylib \
            "$RUNNER_TEMP/translator-target/release/libnvmtl_translate.dylib"
          strip -S "$RUNNER_TEMP/translator-target/release/libnvmtl_translate.dylib"

      - name: Build Metal plug-in executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-out"
          xcrun clang -arch x86_64 -bundle -fobjc-arc -O1 -DNVMTL_RELEASE=1 \
            -Wno-protocol -Wno-incomplete-implementation \
            -I"$RUNNER_TEMP/Vulkan-Headers/include" \
            -o "$RUNNER_TEMP/plugin-out/NVMTLDriver" plugin/NVMTLDevice.m \
            -framework Foundation -framework Metal -framework IOSurface

      - name: Build recovery EFI tool
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build"
          cargo build --locked --release \
            --manifest-path app/efi-safe/Cargo.toml \
            --target x86_64-unknown-uefi \
            --target-dir "$RUNNER_TEMP/efi-target"
          cp "$RUNNER_TEMP/efi-target/x86_64-unknown-uefi/release/nullmoth-safe.efi" \
            app/Resources/NullMothSafe.efi

      - name: Verify built binaries without loading them
        run: |
          set -euo pipefail
          test "$(lipo -archs "$RUNNER_TEMP/plugin-out/NVMTLDriver")" = x86_64
          test "$(lipo -archs "$RUNNER_TEMP/translator-target/release/libnvmtl_translate.dylib")" = x86_64
          # Read strings completely before checking; grep -q closes pipes early.
          plugin_strings="$RUNNER_TEMP/plugin-out/NVMTLDriver.strings.txt"
          strings -a "$RUNNER_TEMP/plugin-out/NVMTLDriver" > "$plugin_strings"
          grep -q NVIDIAShared "$plugin_strings"
          grep -q nvmtl_nvk_dispatch_sass_v1 "$plugin_strings"
          if grep -q -e nvmtl-fps- -e nvmtl-passtime-request "$plugin_strings"; then
            echo "ERROR: diagnostic markers remain in the release plug-in" >&2
            exit 1
          fi

      - name: Build unsigned 1401 app
        env:
          SIGN_IDENTITY: ""
        run: |
          set -euo pipefail
          app/build.sh "$RUNNER_TEMP/app-out"
          test ! -e "$RUNNER_TEMP/app-out/1401.app/Contents/_CodeSignature"

      - name: Stage artifact and checksums
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unsigned-components"
          mkdir -p "$out/bin"
          cp "$RUNNER_TEMP/translator-target/release/libnvmtl_translate.dylib" "$out/bin/"
          cp "$RUNNER_TEMP/plugin-out/NVMTLDriver" "$out/bin/"
          cp "$RUNNER_TEMP/efi-target/x86_64-unknown-uefi/release/nullmoth-safe.efi" "$out/bin/NullMothSafe.efi"
          ditto "$RUNNER_TEMP/app-out/1401.app" "$out/1401.app"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "rust=$RUST_VERSION"
            echo "vulkan_headers_commit=$VULKAN_HEADERS_COMMIT"
            echo "signed=no"
            echo "installable_driver_package=no"
          } > "$out/BUILD-MANIFEST.txt"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | \
              while IFS= read -r file; do shasum -a 256 "$file"; done
          ) > "$out/SHA256SUMS"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nullmoth-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-components
          if-no-files-found: error
          retention-days: 14

  kexts:
    name: Build four x86_64 kext bundles
    runs-on: macos-15-intel
    timeout-minutes: 120

    env:
      OGKM_COMMIT: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sw_vers
          xcodebuild -version
          xcrun clang --version

      - name: Check out pinned NVIDIA OS-independent source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: ${{ env.OGKM_COMMIT }}
          path: .deps/open-gpu-kernel-modules
          fetch-depth: 1
          persist-credentials: false

      - name: Verify NVIDIA revision
        run: |
          set -euo pipefail
          actual=$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)
          test "$actual" = "$OGKM_COMMIT"

      - name: Apply Darwin version-header compatibility patch
        run: |
          set -euo pipefail
          git -C .deps/open-gpu-kernel-modules apply --check \
            "$GITHUB_WORKSPACE/build/patches/ogkm-darwin-version.patch"
          git -C .deps/open-gpu-kernel-modules apply \
            "$GITHUB_WORKSPACE/build/patches/ogkm-darwin-version.patch"

      - name: Build unsigned kexts
        env:
          OGKM: ${{ github.workspace }}/.deps/open-gpu-kernel-modules
          JOBS: "3"
        run: |
          set -euo pipefail
          chmod +x build/build_kexts_ci.sh
          build/build_kexts_ci.sh "$RUNNER_TEMP/kexts"

      - name: Validate bundles without loading them
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kexts"
          for pair in \
            "common/NVRM com.nullmoth.NVRM" \
            "common/NVRMFB com.nullmoth.NVRMFB" \
            "common/NVRMAGDC com.nullmoth.NVRMAGDC" \
            "NVAccel-15/NVAccel com.nullmoth.NVAccel" \
            "NVAccel-26/NVAccel com.nullmoth.NVAccel"; do
            set -- $pair
            bundle="$root/$1.kext"
            exe="$bundle/Contents/MacOS/$(basename "$1")"
            test -f "$exe"
            plutil -lint "$bundle/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = "$2"
            test "$(lipo -archs "$exe")" = x86_64
            file "$exe" | grep -q 'Mach-O 64-bit.*x86_64'
          done
          nm -u "$root/common/NVRM.kext/Contents/MacOS/NVRM" | LC_ALL=C sort > "$root/NVRM-undefined.txt"
          nm -u "$root/NVAccel-15/NVAccel.kext/Contents/MacOS/NVAccel" | LC_ALL=C sort > "$root/NVAccel-15-undefined.txt"
          nm -u "$root/NVAccel-26/NVAccel.kext/Contents/MacOS/NVAccel" | LC_ALL=C sort > "$root/NVAccel-26-undefined.txt"

      - name: Add checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kexts"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "ogkm_commit=$OGKM_COMMIT"
            echo "signed=no"
          } > BUILD-MANIFEST.txt
          find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r file; do
            shasum -a 256 "$file"
          done > SHA256SUMS

      - name: Upload unsigned kext artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nullmoth-kexts-${{ github.sha }}
          path: ${{ runner.temp }}/kexts
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Build source runtime
    runs-on: macos-15-intel
    timeout-minutes: 180

    env:
      MESA_COMMIT: 17ca6174dcc6cb22059ac343bc29f8af7800f42e
      OGKM_COMMIT: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
      VULKAN_HEADERS_COMMIT: 8864cdc896bbc2a9b6eb36b3218fc9ef57908d77
      VULKAN_LOADER_COMMIT: a9e72c66d5cb79911eb9a9063bf4016dd0a3a123
      NVIDIA_DRIVER_VERSION: 610.57.04
      NVIDIA_RUN_SHA256: 83619d878211aadf4c7e1c5de3d2a865c9936fb2dfa5c1b4c3aabccc20c3f283
      RUST_VERSION: 1.87.0

    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out NVIDIA open kernel modules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: ${{ env.OGKM_COMMIT }}
          path: .deps/open-gpu-kernel-modules
          persist-credentials: false

      - name: Check out Vulkan-Headers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_COMMIT }}
          path: .deps/Vulkan-Headers
          persist-credentials: false

      - name: Check out Vulkan-Loader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KhronosGroup/Vulkan-Loader
          ref: ${{ env.VULKAN_LOADER_COMMIT }}
          path: .deps/Vulkan-Loader
          persist-credentials: false

      - name: Check out pinned Mesa source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps/mesa
          git -C .deps/mesa init
          git -C .deps/mesa remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git -C .deps/mesa fetch --depth=1 origin "$MESA_COMMIT"
          git -C .deps/mesa checkout --detach FETCH_HEAD

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .deps/mesa rev-parse HEAD)" = "$MESA_COMMIT"
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = "$OGKM_COMMIT"
          test "$(git -C .deps/Vulkan-Headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          test "$(git -C .deps/Vulkan-Loader rev-parse HEAD)" = "$VULKAN_LOADER_COMMIT"

      - name: Install build-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja llvm spirv-llvm-translator spirv-tools libclc glslang pkg-config
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add rustfmt --toolchain "$RUST_VERSION"
          python3 -m venv .deps/venv
          .deps/venv/bin/pip install \
            meson==1.7.2 \
            Mako==1.3.10 \
            PyYAML==6.0.2 \
            packaging==24.2
          # LLVM 22 requires bindgen's corrected struct-definition lookup.
          cargo install --locked bindgen-cli --version 0.72.1
          cargo install --locked cbindgen --version 0.28.0
          echo "$PWD/.deps/venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix llvm)/lib/pkgconfig:$(brew --prefix spirv-llvm-translator)/lib/pkgconfig:$(brew --prefix spirv-tools)/lib/pkgconfig:$(brew --prefix libclc)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build NVK and Vulkan loader from source
        shell: bash
        run: |
          set -euo pipefail
          bindgen --version --verbose
          rustfmt --version
          sh build/build_runtime_ci.sh "$PWD/.deps" "$PWD/runtime"

      - name: Download pinned NVIDIA firmware package
        shell: bash
        run: |
          set -euo pipefail
          url="https://download.nvidia.com/XFree86/Linux-x86_64/${NVIDIA_DRIVER_VERSION}/NVIDIA-Linux-x86_64-${NVIDIA_DRIVER_VERSION}-no-compat32.run"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output .deps/nvidia-driver.run "$url"
          echo "$NVIDIA_RUN_SHA256  .deps/nvidia-driver.run" | shasum -a 256 -c -
          (cd .deps && sh nvidia-driver.run -x)
          mv ".deps/NVIDIA-Linux-x86_64-${NVIDIA_DRIVER_VERSION}-no-compat32" \
            .deps/nvidia-extracted

      - name: Stage required firmware
        shell: bash
        run: |
          set -euo pipefail
          destination="runtime/Users/Shared/nvfw/nvidia/$NVIDIA_DRIVER_VERSION"
          mkdir -p "$destination"
          for firmware in gsp_ga10x.bin gsp_tu10x.bin ucodes_ga10x.bin ucodes_tu10x.bin; do
            source_path=$(find .deps/nvidia-extracted -type f -name "$firmware" -print -quit)
            test -n "$source_path"
            cp "$source_path" "$destination/$firmware"
            test -s "$destination/$firmware"
          done
          license_path=$(find .deps/nvidia-extracted -maxdepth 2 -type f -name LICENSE -print -quit)
          test -n "$license_path"
          cp "$license_path" "$destination/NVIDIA-LICENSE.txt"

      - name: Record provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_commit=$GITHUB_SHA"
            echo "mesa_commit=$MESA_COMMIT"
            echo "ogkm_commit=$OGKM_COMMIT"
            echo "vulkan_headers_commit=$VULKAN_HEADERS_COMMIT"
            echo "vulkan_loader_commit=$VULKAN_LOADER_COMMIT"
            echo "nvidia_driver_version=$NVIDIA_DRIVER_VERSION"
            echo "nvidia_firmware_archive_sha256=$NVIDIA_RUN_SHA256"
            echo "nvidia_shared_bundle=included-no"
            echo "signed=no"
          } > runtime/BUILD-MANIFEST.txt
          {
            xcrun clang --version
            meson --version
            ninja --version
            cmake --version
            rustc --version
            bindgen --version
            cbindgen --version
          } > runtime/BUILD-TOOLS.txt
          cd runtime
          find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | \
            while IFS= read -r file; do shasum -a 256 "$file"; done > SHA256SUMS

      - name: Upload source-built runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nullmoth-runtime-${{ github.sha }}
          path: runtime
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package complete offline installer
    needs: [build, kexts, runtime]
    permissions:
      actions: read
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}

    steps:
      - name: Check out the exact packaged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Download unsigned components
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "nullmoth-unsigned-${{ github.sha }}" \
            --dir "$RUNNER_TEMP/components"

      - name: Download source-built runtime
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "nullmoth-runtime-${{ github.sha }}" \
            --dir "$RUNNER_TEMP/runtime"

      - name: Download kexts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "nullmoth-kexts-${{ github.sha }}" \
            --dir "$RUNNER_TEMP/kexts"

      - name: Verify runtime provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime"
          shasum -a 256 -c SHA256SUMS
          grep -Fx "source_commit=$SOURCE_SHA" BUILD-MANIFEST.txt
          grep -Fx "mesa_commit=17ca6174dcc6cb22059ac343bc29f8af7800f42e" BUILD-MANIFEST.txt
          grep -Fx "ogkm_commit=e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb" BUILD-MANIFEST.txt
          grep -Fx "vulkan_loader_commit=a9e72c66d5cb79911eb9a9063bf4016dd0a3a123" BUILD-MANIFEST.txt
          grep -Fx "nvidia_firmware_archive_sha256=83619d878211aadf4c7e1c5de3d2a865c9936fb2dfa5c1b4c3aabccc20c3f283" BUILD-MANIFEST.txt
          grep -Fx "nvidia_shared_bundle=included-no" BUILD-MANIFEST.txt
          grep -Fx "signed=no" BUILD-MANIFEST.txt

      - name: Verify component and kext artifacts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/components"
          shasum -a 256 -c SHA256SUMS
          grep -Fx "commit=$SOURCE_SHA" BUILD-MANIFEST.txt
          grep -Fx "signed=no" BUILD-MANIFEST.txt
          cd "$RUNNER_TEMP/kexts"
          shasum -a 256 -c SHA256SUMS
          grep -Fx "source_commit=$SOURCE_SHA" BUILD-MANIFEST.txt
          grep -Fx "ogkm_commit=e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb" BUILD-MANIFEST.txt
          grep -Fx "signed=no" BUILD-MANIFEST.txt

      - name: Stage installable package
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sh build/stage_release.sh \
            "$RUNNER_TEMP/components" \
            "$RUNNER_TEMP/kexts" \
            "$RUNNER_TEMP/runtime" \
            "$RUNNER_TEMP/release" \
            "$PACKAGE_VERSION"

      - name: Verify offline installation payload
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/release/dist"
          (cd "$dist" && shasum -a 256 -c SHA256SUMS)
          verify_dir=$(mktemp -d "$RUNNER_TEMP/package-verify.XXXXXX")
          tar -xzf "$dist/nullmoth-nvidia-$PACKAGE_VERSION.tar.gz" -C "$verify_dir"
          payload="$verify_dir/pkgroot"
          (cd "$payload" && shasum -a 256 -c SHA256SUMS)
          cmp package/install.sh "$payload/install.sh"
          cmp package/uninstall.sh "$payload/uninstall.sh"
          test -x "$payload/install.sh"
          test -x "$payload/uninstall.sh"
          bash -n "$payload/install.sh"
          bash -n "$payload/uninstall.sh"
          for kext in NVRM NVRMFB NVRMAGDC; do
            test -s "$payload/Library/Extensions/$kext.kext/Contents/MacOS/$kext"
          done
          for major in 15 26; do
            test -s "$payload/Library/NullMoth/kexts/$major/NVAccel.kext/Contents/MacOS/NVAccel"
          done
          test -s "$payload/Library/GPUBundles/NVMTLDriver.bundle/Contents/MacOS/NVMTLDriver"
          for library in libnvmtl_translate.dylib libvulkan.dylib libvulkan_nouveau.dylib; do
            test -s "$payload/Library/GPUBundles/nvmtl/$library"
          done
          test -s "$payload/Library/GPUBundles/nvmtl/nvk_icd.json"
          test -s "$payload/Library/GPUBundles/nvmtl-allow.txt"
          for firmware in gsp_ga10x.bin gsp_tu10x.bin ucodes_ga10x.bin ucodes_tu10x.bin NVIDIA-LICENSE.txt; do
            test -s "$payload/Users/Shared/nvfw/nvidia/610.57.04/$firmware"
          done

      - name: Upload installable unsigned release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nullmoth-release-${{ env.PACKAGE_VERSION }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/dist
          if-no-files-found: error
          retention-days: 14
